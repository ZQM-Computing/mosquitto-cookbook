# 02-listener-ports — listener variants. TEST config, not a fleet config.
# Fleet facts this file reflects (do not "fix" them by editing fleet services):
# - Node-1: listener 18883, because 1883 sits in the Windows excluded range
#   1827-1926 on that host. allow_anonymous true there was agent-set and its
#   alignment with Node-3 is pending Alex's decision.
# - Node-3: listener 1883, localhost-only bind; anonymous connections were
#   refused there, so auth is required in practice (see 03-auth-note).
#
# Variant A — localhost-only test listener (the safe default for examples):
listener 1883 127.0.0.1
# Variant B — shifted-port listener, for hosts where 1883 is excluded:
# listener 18883 127.0.0.1
# Variant C — tailnet-scoped listener (bind to the node's tailnet IP, never 0.0.0.0):
# listener 18883 <tailnet-IP>
# A 0.0.0.0 bind is never shown as an option: the fleet's private-binding
# rule forbids it for this class of service.
allow_anonymous true
# allow_anonymous true here is TEST-ONLY (see 01-pub-sub note).
persistence false
