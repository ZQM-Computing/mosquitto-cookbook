# 01-pub-sub — TEST broker config. Standalone file for a local test instance.
# Never copy this over a fleet broker config; fleet auth is an open decision
# (see 03-auth-note) and fleet bindings are tailnet-scoped, not localhost.
listener 1883 127.0.0.1
allow_anonymous true
# allow_anonymous true here is a TEST-ONLY choice so the round-trip script
# runs without credentials. It is not fleet policy; see 03-auth-note.
persistence false
